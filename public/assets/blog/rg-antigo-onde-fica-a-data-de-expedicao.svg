<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Onde fica a data de expedição no RG antigo</title>
  <desc id="d">Desenho esquemático do verso de um RG no modelo antigo. A data de expedição aparece no alto, à direita, ao lado do número do registro geral. Mais abaixo fica a data de nascimento, que é outra informação.</desc>
  <rect width="640" height="520" fill="#f3f6f9"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#172033">VERSO DO RG ANTIGO</text>
  <rect x="40" y="54" width="560" height="400" rx="12" fill="#ffffff" stroke="#b9c4d2" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#566174">VÁLIDA EM TODO O TERRITÓRIO NACIONAL</text>

  <text x="76" y="132" font-size="15" font-weight="700" fill="#566174">REGISTRO GERAL</text>
  <text x="76" y="166" font-size="20" fill="#172033">12.345.678-9</text>
  <rect x="330" y="102" width="252" height="84" rx="8" fill="#fff4d6" stroke="#f59e0b" stroke-width="4"/>
  <text x="348" y="132" font-size="15" font-weight="700" fill="#78350f">DATA DE EXPEDIÇÃO</text>
  <text x="348" y="166" font-size="24" font-weight="800" fill="#172033">10/05/2012</text>
  <circle cx="582" cy="102" r="22" fill="#f59e0b"/>
  <text x="582" y="111" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">1</text>

  <rect x="76" y="206" width="490" height="20" rx="5" fill="#e8edf3"/>
  <rect x="76" y="236" width="490" height="20" rx="5" fill="#e8edf3"/>

  <rect x="58" y="272" width="524" height="72" rx="8" fill="#eaf3ff" stroke="#0056b3" stroke-width="4"/>
  <text x="76" y="300" font-size="15" font-weight="700" fill="#003d82">DATA DE NASCIMENTO</text>
  <text x="76" y="328" font-size="19" fill="#172033">23/08/1990</text>
  <circle cx="582" cy="272" r="22" fill="#0056b3"/>
  <text x="582" y="281" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>

  <rect x="76" y="364" width="490" height="20" rx="5" fill="#e8edf3"/>
  <text x="566" y="432" text-anchor="end" font-size="15" fill="#566174">Assinatura do diretor</text>
  <text x="320" y="492" text-anchor="middle" font-size="15" fill="#566174">Desenho ilustrativo. Dados fictícios; o modelo muda por estado e época.</text>
</svg>
