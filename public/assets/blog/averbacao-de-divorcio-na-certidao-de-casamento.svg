<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Exemplo de averbação de divórcio na certidão de casamento</title>
  <desc id="d">Desenho esquemático da parte de baixo de uma certidão de casamento. O campo de averbações e anotações traz um texto de exemplo informando o divórcio do casal e o nome que cada um passou a usar.</desc>
  <rect width="640" height="560" fill="#f3f6f9"/>
  <rect x="40" y="24" width="560" height="512" rx="10" fill="#ffffff" stroke="#b9c4d2" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-size="24" font-weight="800" fill="#003d82">CERTIDÃO DE CASAMENTO</text>
  <rect x="70" y="92" width="500" height="24" rx="5" fill="#e8edf3"/>
  <rect x="70" y="128" width="500" height="24" rx="5" fill="#e8edf3"/>
  <rect x="70" y="164" width="330" height="24" rx="5" fill="#e8edf3"/>

  <rect x="62" y="212" width="516" height="232" rx="8" fill="#eaf3ff" stroke="#0056b3" stroke-width="4"/>
  <text x="80" y="244" font-size="16" font-weight="700" fill="#003d82">AVERBAÇÕES / ANOTAÇÕES</text>
  <g font-size="19" fill="#172033">
    <text x="80" y="284">Divórcio do casal por sentença de</text>
    <text x="80" y="312">10/03/2021, transitada em julgado.</text>
    <text x="80" y="352">A mulher voltou a usar o nome</text>
    <text x="80" y="380">de solteira: MARIA DA SILVA.</text>
    <text x="80" y="420">Averbado em 02/04/2021.</text>
  </g>

  <rect x="70" y="466" width="220" height="18" rx="4" fill="#e8edf3"/>
  <text x="570" y="482" text-anchor="end" font-size="15" fill="#566174">Assinatura do oficial</text>
  <text x="320" y="520" text-anchor="middle" font-size="15" fill="#566174">Texto de exemplo. Nomes e datas fictícios.</text>
</svg>
