  <rect x="80" y="646" width="300" height="18" rx="4" fill="#c9dcf3"/>
  <circle cx="578" cy="544" r="24" fill="#0056b3"/>
  <text x="578" y="553" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">2</text>

  <rect x="70" y="700" width="220" height="18" rx="4" fill="#e8edf3"/>
  <text x="570" y="716" text-anchor="end" font-size="15" fill="#566174">Assinatura do oficial</text>
  <text x="320" y="754" text-anchor="middle" font-size="15" fill="#566174">Desenho ilustrativo. Dados fictícios.</text>
