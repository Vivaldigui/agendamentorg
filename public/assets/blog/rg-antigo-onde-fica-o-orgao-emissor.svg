<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Onde fica o órgão emissor no RG antigo</title>
  <desc id="d">Desenho esquemático da frente e do verso de um RG no modelo antigo. Na frente, o cabeçalho traz o estado e o órgão que emitiu o documento, como a secretaria de segurança pública e o instituto de identificação. No verso ficam o número do registro geral, a data de expedição e o documento de origem, que é a certidão do cartório e não o órgão emissor.</desc>
  <rect width="640" height="820" fill="#f3f6f9"/>

  <text x="40" y="40" font-size="18" font-weight="800" fill="#172033">FRENTE</text>
  <rect x="40" y="54" width="560" height="300" rx="12" fill="#ffffff" stroke="#b9c4d2" stroke-width="2"/>
  <rect x="58" y="70" width="524" height="128" rx="8" fill="#fff4d6" stroke="#f59e0b" stroke-width="4"/>
  <g text-anchor="middle" fill="#172033">
    <text x="320" y="98" font-size="17" font-weight="700">REPÚBLICA FEDERATIVA DO BRASIL</text>
    <text x="320" y="124" font-size="17" font-weight="700">ESTADO DE [UF]</text>
    <text x="320" y="150" font-size="17" font-weight="700">SECRETARIA DA SEGURANÇA PÚBLICA</text>
    <text x="320" y="176" font-size="17" font-weight="700">INSTITUTO DE IDENTIFICAÇÃO</text>
  </g>
  <circle cx="582" cy="70" r="22" fill="#f59e0b"/>
  <text x="582" y="79" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">1</text>
  <rect x="70" y="218" width="96" height="120" rx="6" fill="#e8edf3"/>
  <text x="118" y="284" text-anchor="middle" font-size="15" fill="#566174">Foto</text>
  <rect x="190" y="248" width="230" height="22" rx="5" fill="#e8edf3"/>
  <text x="190" y="294" font-size="15" fill="#566174">Assinatura do titular</text>
  <rect x="460" y="226" width="110" height="104" rx="52" fill="#e8edf3"/>
  <text x="515" y="284" text-anchor="middle" font-size="15" fill="#566174">Digital</text>

  <text x="40" y="402" font-size="18" font-weight="800" fill="#172033">VERSO</text>
  <rect x="40" y="416" width="560" height="350" rx="12" fill="#ffffff" stroke="#b9c4d2" stroke-width="2"/>
  <rect x="58" y="432" width="524" height="76" rx="8" fill="#eaf3ff" stroke="#0056b3" stroke-width="4"/>
  <text x="76" y="460" font-size="15" font-weight="700" fill="#003d82">REGISTRO GERAL</text>
  <text x="76" y="490" font-size="19" font-weight="700" fill="#172033">12.345.678-9</text>
  <text x="340" y="460" font-size="15" font-weight="700" fill="#003d82">DATA DE EXPEDIÇÃO</text>
  <text x="340" y="490" font-size="19" font-weight="700" fill="#172033">10/05/2012</text>
  <circle cx="582" cy="432" r="22" fill="#0056b3"/>
  <text x="582" y="441" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
  <rect x="76" y="526" width="490" height="20" rx="5" fill="#e8edf3"/>
  <rect x="76" y="556" width="490" height="20" rx="5" fill="#e8edf3"/>
  <rect x="76" y="586" width="300" height="20" rx="5" fill="#e8edf3"/>
  <rect x="58" y="622" width="524" height="72" rx="8" fill="#fde8e8" stroke="#b42318" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="76" y="650" font-size="15" font-weight="700" fill="#7a271a">DOC. ORIGEM</text>
  <text x="76" y="678" font-size="17" fill="#172033">Certidão: cartório, livro, folha, termo</text>
  <circle cx="582" cy="622" r="22" fill="#b42318"/>
  <text x="582" y="631" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
  <rect x="76" y="716" width="220" height="18" rx="4" fill="#e8edf3"/>
  <text x="566" y="732" text-anchor="end" font-size="15" fill="#566174">Assinatura do diretor</text>
  <text x="320" y="802" text-anchor="middle" font-size="15" fill="#566174">Desenho ilustrativo. O modelo varia por estado e por época.</text>
</svg>
