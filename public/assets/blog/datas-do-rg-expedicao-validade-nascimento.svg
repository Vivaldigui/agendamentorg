<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">As três datas do documento de identidade</title>
  <desc id="d">Comparação entre data de nascimento, data de expedição e data de validade. A data de expedição é o dia em que o documento foi emitido e muda a cada nova via. Na Carteira de Identidade Nacional, a validade é calculada pela idade do titular nessa data: cinco anos até 11 anos, dez anos de 12 a 59 anos e validade indeterminada a partir de 60 anos.</desc>
  <rect width="640" height="540" fill="#f3f6f9"/>
  <text x="320" y="40" text-anchor="middle" font-size="21" font-weight="800" fill="#172033">Três datas, três funções</text>

  <rect x="40" y="62" width="560" height="104" rx="12" fill="#ffffff" stroke="#b9c4d2" stroke-width="2"/>
  <text x="64" y="96" font-size="19" font-weight="800" fill="#003d82">Data de nascimento</text>
  <text x="64" y="126" font-size="17" fill="#172033">Vem da certidão. Nunca muda.</text>
  <text x="64" y="152" font-size="17" fill="#566174">Não é a data do documento.</text>

  <rect x="40" y="182" width="560" height="134" rx="12" fill="#fff4d6" stroke="#f59e0b" stroke-width="4"/>
  <text x="64" y="216" font-size="19" font-weight="800" fill="#78350f">Data de expedição (ou de emissão)</text>
  <text x="64" y="246" font-size="17" fill="#172033">Dia em que aquela via foi emitida.</text>
  <text x="64" y="272" font-size="17" fill="#172033">Muda a cada nova via ou renovação.</text>
  <text x="64" y="298" font-size="17" fill="#566174">É a que os formulários pedem.</text>

  <rect x="40" y="332" width="560" height="168" rx="12" fill="#eaf3ff" stroke="#0056b3" stroke-width="3"/>
  <text x="64" y="366" font-size="19" font-weight="800" fill="#003d82">Validade (só na CIN)</text>
  <text x="64" y="396" font-size="17" fill="#172033">Conta pela idade na data de expedição:</text>
  <text x="84" y="424" font-size="17" fill="#172033">• 0 a 11 anos: 5 anos</text>
  <text x="84" y="450" font-size="17" fill="#172033">• 12 a 59 anos: 10 anos</text>
  <text x="84" y="476" font-size="17" fill="#172033">• 60 anos ou mais: indeterminada</text>
  <text x="320" y="526" text-anchor="middle" font-size="15" fill="#566174">Fonte: Decreto nº 10.977/2022, artigo 15.</text>
</svg>
